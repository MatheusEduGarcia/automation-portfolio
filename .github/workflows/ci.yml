name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Compile ESP32 sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use example secrets
        run: |
          for d in projects/*/firmware/*/; do cp "$d/secrets.example.h" "$d/secrets.h"; done
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: PubSubClient
          sketch-paths: |
            - projects/01-esp32-mqtt-remote-io/firmware/esp32_mqtt_io
            - projects/02-esp32-mqtt-andon-system/firmware/esp32_machine_control

  flows:
    name: Check Node-RED flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lab flows.json is up to date and every wire points to a real node
        run: |
          cp projects/03-node-red-iiot-lab/node-red/flows.json /tmp/committed.json
          python projects/03-node-red-iiot-lab/build_flows.py
          diff -q /tmp/committed.json projects/03-node-red-iiot-lab/node-red/flows.json
          python - <<'PY'
          import json
          nodes = json.load(open("projects/03-node-red-iiot-lab/node-red/flows.json"))
          ids = {n["id"] for n in nodes}
          bad = [(n["id"], t) for n in nodes for w in n.get("wires", []) for t in w if t not in ids]
          bad += [(n["id"], n[k]) for n in nodes for k in ("z", "group", "tab", "broker") if k in n and n[k] not in ids and n["type"] != "mqtt-broker"]
          assert not bad, bad
          print(len(nodes), "nodes, wiring ok")
          PY
